[project]
name = "arte-suave-mcp"
version = "0.1.0"
description = "Private FastMCP server for Arte Suave class schedule and bookings"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.98",
    "fastmcp>=4.0.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "selectolax>=0.4.12",
    "uvicorn>=0.53.0",
]

[project.scripts]
arte-suave-mcp = "arte_suave_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "playwright>=1.63.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arte_suave_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", ".build", "discovery"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
